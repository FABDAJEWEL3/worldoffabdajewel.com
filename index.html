<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><meta name="description" content="Welcome to the World of FAB Da Jewel. Explore official music, streaming platforms, and social media."><title>WORLD OF FAB DA JEWEL | Official Music</title>
<style>
:root{color-scheme:dark;--gold:#d8ad54;--cream:#fff1c6}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#070708;color:#fff;font-family:Arial,Helvetica,sans-serif;background-image:radial-gradient(ellipse at 50% 10%,#51251b66,transparent 35%),radial-gradient(ellipse at 50% 45%,#8d591b22,transparent 50%)}.wrap{width:min(100% - 32px,520px);margin:auto;padding:25px 0 48px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.36em;color:var(--gold);font-weight:700}.portrait{width:100%;max-height:330px;object-fit:cover;object-position:center 35%;border-radius:18px 18px 5px 5px;mask-image:linear-gradient(#000 75%,transparent);-webkit-mask-image:linear-gradient(#000 75%,transparent);margin:16px auto -40px;display:block}.logo{width:100%;max-width:490px;display:block;margin:auto;mix-blend-mode:screen;filter:drop-shadow(0 5px 15px #d8ad5422)}h1{font-family:Georgia,serif;font-size:clamp(21px,5vw,30px);letter-spacing:.08em;color:var(--cream);margin:6px 0 7px}.tag{font-size:12px;letter-spacing:.18em;color:#d6bd8a;margin:0 0 29px}.section{display:flex;align-items:center;gap:12px;color:#d4bb87;font-size:11px;letter-spacing:.26em;font-weight:700;margin:24px 0 14px}.section:before,.section:after{content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,#967339,transparent)}.links{display:grid;gap:11px}.link{width:100%;min-height:59px;border:1px solid #b78a41;border-radius:14px;background:linear-gradient(120deg,#161414,#080809 55%,#21180d);box-shadow:inset 0 0 0 1px #47361b,0 2px 16px #a97b1a1a;color:#fff;text-decoration:none;display:flex;align-items:center;padding:0 18px;gap:12px;text-align:left;font-weight:750;font-size:17px;transition:transform .2s,border-color .2s}.link:hover{transform:translateY(-2px);border-color:#ffe3a0}.glyph{width:30px;text-align:center;color:var(--gold);font-size:23px}.action{margin-left:auto;font-size:10px;letter-spacing:.1em;color:#e8c575;white-space:nowrap}.link[aria-disabled=true]{opacity:.65;cursor:not-allowed}.link[aria-disabled=true]:hover{transform:none}.note{font-size:12px;color:#a5a0a0;line-height:1.6;margin:22px 0}.footer{margin-top:30px;color:#a88a50;letter-spacing:.18em;font-size:11px}.diamond{color:#edc76c;font-size:25px;margin-bottom:8px}@media(max-width:390px){.action{font-size:9px}.link{font-size:15px;padding:0 12px}}
</style></head><body><main class="wrap"><div class="eyebrow">WELCOME TO THE</div><img class="portrait" src="fab-portrait.jpg" alt="FAB Da Jewel artist portrait"><img class="logo" src="fab-logo.jpg" alt="FAB DA JEWEL gold and diamond logo"><h1>WORLD OF FAB DA JEWEL</h1><p class="tag">YOUR GATEWAY TO MY MUSIC</p><div class="section">STREAM MY MUSIC</div><div id="music" class="links"></div><div class="section">CONNECT WITH ME</div><div id="social" class="links"></div><p class="note">Choose your favorite platform and explore the official FAB Da Jewel catalog.</p><div class="diamond">◆</div><div class="footer">WORLD OF FAB DA JEWEL © 2026</div></main>
<script>

const profiles = {
  spotify: '',
  appleMusic: '',
  youtubeMusic: '',
  amazonMusic: '',
  tidal: '',
  pandora: '',
  instagram: '',
  tiktok: '',

const services=[
 ['Spotify','spotify','♫','LISTEN NOW'],['Apple Music','appleMusic','♫','LISTEN NOW'],['YouTube Music','youtubeMusic','▶','LISTEN NOW'],['Amazon Music','amazonMusic','♫','LISTEN NOW'],['TIDAL','tidal','◆','LISTEN NOW'],['Pandora','pandora','◖','LISTEN NOW'],

for(const [name,key,glyph,cta] of services){const a=document.createElement('a');const url=profiles[key];const valid=typeof url==='string'&&/^https:\/\//i.test(url);a.className='link';a.innerHTML='<span class="glyph"></span><span></span><span class="action"></span>';a.children[0].textContent=glyph;a.children[1].textContent=name;a.children[2].textContent=valid?cta:'COMING SOON';if(valid){a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label',name+' official artist profile')}else{a.setAttribute('aria-disabled','true');a.setAttribute('title','Official profile link pending verification');a.addEventListener('click',e=>e.preventDefault())}document.getElementById(['instagram','tiktok','youtube'].includes(key)?'social':'music').appendChild(a)}
</script></body></html>
